---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homebridge
  namespace: {{ .Release.Namespace }}
  labels:
    app: homebridge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homebridge
  template:
    metadata:
      labels:
        app: homebridge
{{/*      annotations:*/}}
{{/*        checksum/settings: {{ include (print $.Template.BasePath "/configmap_settings.yaml") $ | sha256sum }}*/}}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        - name: init-copy-config
          image: alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              mkdir -p /homebridge
              cp -a /tmp/homebridge-config/. /homebridge/
          volumeMounts:
            - name: config-files
              mountPath: /tmp/homebridge-config
            - name: data
              mountPath: /homebridge
      containers:
        - name: homebridge
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http-homebridge
              containerPort: 8581
            - name: tcp-hap
              containerPort: 32235
          startupProbe:
            httpGet:
              path: /
              port: 8581
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /
              port: 8581
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: 8581
            periodSeconds: 60
            failureThreshold: 5
            timeoutSeconds: 2
          env:
            - name: TZ
              value: {{ .Values.timezone }}
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory }}
              cpu: {{ .Values.resources.requests.cpu }}
            limits:
              memory: {{ .Values.resources.limits.memory }}
              cpu: {{ .Values.resources.limits.cpu }}
          volumeMounts:
            - name: data
              mountPath: /homebridge
            - name: dbus-socket
              mountPath: /var/run/dbus
            - name: avahi-socket
              mountPath: /var/run/avahi-daemon/socket
      volumes:
        - name: data
          hostPath:
            path: /opt/tekn0ir/homebridge
            type: DirectoryOrCreate
        - name: config-files
          configMap:
            name: homebridge-settings
        - name: dbus-socket
          hostPath:
            path: /var/run/dbus
            type: Directory
        - name: avahi-socket
          hostPath:
            path: /var/run/avahi-daemon/socket
            type: Socket